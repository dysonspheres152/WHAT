<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Profile | DYSON</title>
<meta name="description" content="DYSON. Connect. Message. Share. Fast, private and simple messaging."><meta name="theme-color" content="#050a14"><link rel="icon" href="icon.png"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="style.css"><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="core.js"></script><script src="menu.js"></script><script src="crop.js"></script></head><body><div class="page"><div class="page-head"><a class="icon-btn" href="app.html" aria-label="Back to messages" style="text-decoration:none">←</a><h1>Your profile</h1></div>
<div id="loading" class="loading"><span class="spinner" role="status" aria-label="Loading"></span></div>
<form id="form" class="card" novalidate hidden><div id="formMsg" class="form-msg" role="alert" hidden></div>
<div class="avatar-pick"><label class="avatar-edit" for="avatar" title="Change profile photo"><span id="avatarBox"></span><span class="cam" aria-hidden="true"><svg class="ic sm"><use href="icons.svg#i-camera"/></svg></span></label><div style="flex:1"><b style="font-size:14px">Profile photo</b><small class="hint" style="display:block">Tap the photo, choose a picture, then crop it to a circle.</small><input id="avatar" class="sr" type="file" accept="image/png,image/jpeg,image/webp,image/gif" aria-label="Choose profile photo" aria-describedby="avatar-err"><span class="err" id="avatar-err" aria-live="polite"></span></div></div>
<div class="field"><label for="full_name">Full name</label><input class="input" id="full_name" name="full_name" type="text" placeholder="" autocomplete="name" aria-describedby="full_name-err" ><span class="err" id="full_name-err" aria-live="polite"></span></div><div class="field"><label for="username">Username</label><input class="input" id="username" name="username" type="text" placeholder="" autocomplete="off" aria-describedby="username-err" maxlength="21"><span class="err" id="username-err" aria-live="polite"></span></div>
<div class="field"><label for="email">Email</label><input class="input" id="email" type="email" disabled></div>
<div class="field"><label for="phone">Phone number (international format)</label><input class="input" id="phone" type="tel" placeholder="+256700000000" autocomplete="tel" aria-describedby="phone-err"><span class="err" id="phone-err"></span><p class="hint">Not verified yet. Only used for discovery if you allow it in Settings. Never shown to others.</p></div>
<div class="field"><label for="about">About</label><textarea class="input" id="about" rows="3" maxlength="300" aria-describedby="about-err"></textarea><span class="err" id="about-err"></span></div>
<div class="field"><label for="bio">Description</label><textarea class="input" id="bio" rows="3" maxlength="160" placeholder="Building the future with technology." aria-describedby="bio-err"></textarea><span class="err" id="bio-err"></span></div>
<div class="field"><label for="status">Status</label><input class="input" id="status" list="statuses" maxlength="60" aria-describedby="status-err"><datalist id="statuses"><option value="Available"><option value="Busy"><option value="At work"><option value="In a meeting"><option value="Away"></datalist><span class="err" id="status-err"></span></div>
<button id="submit" class="btn btn-primary" type="submit">Save changes</button></form></div><script src="profile.js"></script></body></html>
