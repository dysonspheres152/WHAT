<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Create your account | DYSON</title>
<meta name="description" content="DYSON. Connect. Message. Share. Fast, private and simple messaging."><meta name="theme-color" content="#050a14"><link rel="icon" href="icon.png"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="style.css"><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="core.js"></script></head><body data-page="register"><div class="auth"><section class="auth-brand"><a class="logo" href="index.html" aria-label="DYSON home"><img src="icon.png" alt="" width="36" height="36"><span>DYSON</span></a><div><h2>Connect. Message. Share.</h2><p>Fast, private and simple messaging built for modern communication.</p></div><small>&copy; DYSON</small></section>
<main class="auth-main"><div class="auth-card"><div class="top"><a href="index.html" class="link">&larr; Home</a><button class="icon-btn" data-theme-toggle aria-label="Toggle light and dark theme">◐</button></div>
<h1 style="font-size:1.9rem">Create your account</h1><p style="color:var(--muted)">Join DYSON in under a minute.</p>
<button type="button" id="google" class="btn btn-block"><b style="color:#4285f4">G</b> Continue with Google</button><p class="hint" style="text-align:center;margin:12px 0">or use email</p>
<form id="form" novalidate><div id="formMsg" class="form-msg" role="alert" hidden></div><div class="avatar-pick"><div id="avatarBox"></div><div style="flex:1"><label for="avatar" style="font-weight:600;font-size:14px">Profile photo (optional)</label><input id="avatar" type="file" accept="image/png,image/jpeg,image/webp,image/gif" aria-describedby="avatar-err"><span class="err" id="avatar-err" aria-live="polite"></span></div></div><div class="field"><label for="full_name">Full name</label><input class="input" id="full_name" name="full_name" type="text" placeholder="Your name" autocomplete="name" aria-describedby="full_name-err" ><span class="err" id="full_name-err" aria-live="polite"></span></div><div class="field"><label for="username">Username</label><input class="input" id="username" name="username" type="text" placeholder="username" autocomplete="username" aria-describedby="username-err" maxlength="21"><span class="err" id="username-err" aria-live="polite"></span></div><div class="field"><label for="email">Email</label><input class="input" id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" aria-describedby="email-err" ><span class="err" id="email-err" aria-live="polite"></span></div><div class="field"><label for="password">Password</label><input class="input" id="password" name="password" type="password" placeholder="At least 8 characters" autocomplete="new-password" aria-describedby="password-err" ><span class="err" id="password-err" aria-live="polite"></span></div><div class="meter" id="meter" aria-hidden="true" style="margin:-8px 0 16px"><i></i></div><div class="field"><label for="confirm">Confirm password</label><input class="input" id="confirm" name="confirm" type="password" placeholder="" autocomplete="new-password" aria-describedby="confirm-err" ><span class="err" id="confirm-err" aria-live="polite"></span></div><button id="submit" class="btn btn-primary btn-block" type="submit">Create account</button></form><p style="margin-top:20px;text-align:center">Already have an account? <a href="login.html">Sign in</a></p></div></main></div>
<script src="auth.js"></script></body></html>
