<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Welcome back | DYSON</title>
<meta name="description" content="DYSON. Connect. Message. Share. Fast, private and simple messaging."><meta name="theme-color" content="#050a14"><link rel="icon" href="icon.png"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="style.css"><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="core.js"></script></head><body data-page="login"><div class="auth"><section class="auth-brand"><a class="logo" href="index.html" aria-label="DYSON home"><img src="icon.png" alt="" width="36" height="36"><span>DYSON</span></a><div><h2>Connect. Message. Share.</h2><p>Fast, private and simple messaging built for modern communication.</p></div><small>&copy; DYSON</small></section>
<main class="auth-main"><div class="auth-card"><div class="top"><a href="index.html" class="link">&larr; Home</a><button class="icon-btn" data-theme-toggle aria-label="Toggle light and dark theme">◐</button></div>
<h1 style="font-size:1.9rem">Welcome back</h1><p style="color:var(--muted)">Sign in to continue your conversations.</p>
<button type="button" id="google" class="btn btn-block"><b style="color:#4285f4">G</b> Continue with Google</button><p class="hint" style="text-align:center;margin:12px 0">or use email</p>
<form id="form" novalidate><div id="formMsg" class="form-msg" role="alert" hidden></div><div class="field"><label for="identifier">Email or username</label><input class="input" id="identifier" name="identifier" type="text" placeholder="you@example.com or @username" autocomplete="username" aria-describedby="identifier-err" ><span class="err" id="identifier-err" aria-live="polite"></span></div><div class="field"><label for="password">Password</label><input class="input" id="password" name="password" type="password" placeholder="" autocomplete="current-password" aria-describedby="password-err" ><span class="err" id="password-err" aria-live="polite"></span></div><div class="row2"><label class="check"><input type="checkbox" id="remember" checked> Remember me</label><a href="forgot-password.html">Forgot password?</a></div><button id="submit" class="btn btn-primary btn-block" type="submit">Sign in</button></form><p style="margin-top:20px;text-align:center">New to DYSON? <a href="register.html">Create account</a></p></div></main></div>
